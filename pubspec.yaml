name: iot_smart_flutter
description: "Flutter rewrite of the boarding house management app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_database: ^12.0.1
  firebase_auth: ^6.1.0
  firebase_messaging: ^16.0.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

